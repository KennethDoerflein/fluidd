name: RELEASE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile

      - name: Run lint
        run: |
          pnpm run lint --no-fix

      - name: Run type check
        run: |
          pnpm run type-check

      - name: Run tests
        run: |
          pnpm run test:unit

      - name: Run circular references check
        run: |
          pnpm run circular-check

      - name: Build
        run: |
          pnpm run build

      - name: Create Artifact
        run: |
          cd ./dist
          zip -r ../fluidd.zip ./

      - name: Release Firmware Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: ./fluidd.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidd-${{ github.sha }}.zip
          path: ./dist
